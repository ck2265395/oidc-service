name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OIDC_TEST_DATABASE_URL: postgres://oidc_test:oidc_test@127.0.0.1:5432/oidc_test
      REDIS_TEST_URL: redis://127.0.0.1:6379/1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oidc_test
          POSTGRES_USER: oidc_test
          POSTGRES_PASSWORD: oidc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oidc_test -d oidc_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Frontend JavaScript syntax
        run: node --check public/developer.js
      - name: Web example JavaScript syntax
        run: node --check examples/web-client/server.js
      - name: Native example TSX syntax
        run: |
          node --input-type=module -e "import ts from 'typescript'; import { readFileSync } from 'node:fs'; const result = ts.transpileModule(readFileSync('examples/native/App.tsx', 'utf8'), { compilerOptions: { jsx: ts.JsxEmit.ReactJSX, target: ts.ScriptTarget.ES2022 }, reportDiagnostics: true }); if (result.diagnostics?.length) { console.error(result.diagnostics); process.exit(1); }"
      - name: Unit and HTTP tests
        run: npm test
      - name: PostgreSQL and Redis integration tests
        run: npm run test:storage
      - name: Build
        run: npm run build
