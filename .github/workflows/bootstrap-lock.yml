name: Bootstrap dependency lock

on:
  push:
    branches:
      - 'codex/oidc-platform-foundation'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate the exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the lockfile to this development branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already current."
            exit 0
          fi
          git config user.name "DT"
          git config user.email "dt@users.noreply.github.com"
          git commit -m "build: add exact npm dependency lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
